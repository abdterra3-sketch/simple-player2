name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Buat file proyek
        run: |
          mkdir -p app/src/main/java/com/adjm/simpleplayer

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SimplePlayer"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.adjm.simpleplayer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.adjm.simpleplayer"
                  minSdk 26
                  targetSdk 33
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:icon="@mipmap/ic_launcher"
                  android:label="ADJM MP4 Player"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
      - name: Pasang kode dan judul
        run: |
          [ -f MainActivity.java ] || { echo "MainActivity.java belum diunggah ke halaman utama repo"; exit 1; }
          cp MainActivity.java app/src/main/java/com/adjm/simpleplayer/MainActivity.java
          mkdir -p app/src/main/res/drawable-nodpi
          [ -f judul.png ] || { echo "judul.png belum diunggah ke halaman utama repo"; exit 1; }
          cp judul.png app/src/main/res/drawable-nodpi/judul.png
      - name: Buat ikon dari gambar
        run: |
          [ -f icon_mp4.png ] || { echo "icon_mp4.png belum diunggah ke halaman utama repo"; exit 1; }
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}
            s=${pair##*:}
            mkdir -p app/src/main/res/mipmap-$d
            convert icon_mp4.png -resize ${s}x${s} app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - run: gradle assembleDebug --no-daemon
      - name: Cek isi APK
        run: |
          ls -l app/build/outputs/apk/debug/
          unzip -l app/build/outputs/apk/debug/*.apk | grep -E "classes.dex|judul|ic_launcher" || echo "ISI APK TIDAK LENGKAP"
      - uses: actions/upload-artifact@v4
        with:
          name: SimplePlayer-APK
          path: app/build/outputs/apk/debug/*.apk
